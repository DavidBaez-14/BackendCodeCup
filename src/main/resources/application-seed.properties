# Perfil seed (spec 0019): crea los usuarios y datos de prueba en Supabase #1 y termina solo.
# Levanta en un puerto libre aleatorio para no chocar con el backend que corre en :8082.
# (Sin servidor web no arranca: SecurityConfig necesita la configuración web de Spring Security.)
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=seed   (Windows: .\mvnw.cmd ...)
server.port=0
spring.main.banner-mode=off
