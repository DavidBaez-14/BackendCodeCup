spring.application.name=BackendCodeCup
server.port=${SERVER_PORT:8082}

# ── Base de datos: Supabase #1 (pooler en modo sesión) ────────────────────
# La contraseña solo llega por .env; aquí no hay secretos por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.jcuzocrgyomnuagvnwra}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# El esquema lo versiona Flyway (db/migration). Hibernate solo comprueba que
# las entidades coincidan con las tablas: nunca crea ni altera nada.
spring.jpa.hibernate.ddl-auto=validate
# Un schema por módulo. El primero guarda flyway_schema_history.
spring.flyway.schemas=identidad,competicion,finanzas,analytics
spring.flyway.locations=classpath:db/migration

# ── Supabase Auth: el backend solo valida el access token con el JWKS público ──
# Nunca llama a la API de Supabase Auth (spec 0017).
supabase.url=${SUPABASE_URL:https://jcuzocrgyomnuagvnwra.supabase.co}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${supabase.url}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${supabase.url}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
# Clave pública (sb_publishable_...). Solo prellena el "Token de prueba" de Swagger.
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}

# ── Supabase Storage (comprobantes) ───────────────────────────────────────
# Clave secreta nueva (sb_secret_...), solo backend. Vacía = Storage deshabilitado.
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.storage.bucket=comprobantes-inscripcion

# ── Web ───────────────────────────────────────────────────────────────────
# Orígenes permitidos por CORS. El primero también arma los enlaces de invitación.
app.frontend-urls=${FRONTEND_URLS:http://localhost:5173}
# Correo que recibe ADMINISTRADOR al registrarse mientras no haya ningún admin.
app.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}

# ── Analytics ─────────────────────────────────────────────────────────────
# Shared secret de los disparadores de snapshot. Vacío = webhooks deshabilitados.
analytics.webhook.secret=${ANALYTICS_WEBHOOK_SECRET:}

springdoc.swagger-ui.path=/swagger-ui/index.html
# Solo health por HTTP; el resto de actuator queda cerrado.
management.endpoints.web.exposure.include=health
spring.sql.init.mode=never
