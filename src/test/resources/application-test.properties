# Perfil de pruebas: H2 en memoria, sin Docker ni Supabase (.context/spec.md §1.6).
# Los cuatro schemas se crean al abrir la conexión porque las entidades declaran
# @Table(schema=...) explícito.
spring.datasource.url=jdbc:h2:mem:codecup;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS identidad\\;CREATE SCHEMA IF NOT EXISTS competicion\\;CREATE SCHEMA IF NOT EXISTS finanzas\\;CREATE SCHEMA IF NOT EXISTS analytics
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Las migraciones se validan aparte contra Postgres embebido (FlywayBaselineTest).
spring.flyway.enabled=false

# Valores que en desarrollo llegan por .env.
supabase.url=http://localhost:0
supabase.secret-key=test-secret-key
supabase.publishable-key=sb_publishable_test
analytics.webhook.secret=test-webhook-secret
app.frontend-urls=http://localhost:5173
app.bootstrap-admin-email=
